<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030303"><title>Invitation</title>
<style>
:root{--bg:#030303;--fg:#efefeb;--muted:#8e8e89;--gold:#d3ad3b}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;overflow:hidden}body{display:grid;place-items:center}body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.025) 4px)}#stage{width:min(92vw,700px);min-height:60vh;display:grid;place-items:center;text-align:center;padding:24px;position:relative}.scene{grid-area:1/1;width:100%;opacity:0;filter:blur(5px);transform:scale(.985) translateY(5px);transition:opacity 1.25s cubic-bezier(.22,.61,.36,1),filter 1.35s ease,transform 1.35s ease;pointer-events:none}.scene.show{opacity:1;filter:blur(0);transform:scale(1)}.scene.leave{opacity:0;filter:blur(3px);transform:scale(1.008)}.symbols{font-size:clamp(54px,16vw,108px);font-weight:300;letter-spacing:.13em;white-space:nowrap}.eyebrow{font-size:clamp(11px,2.8vw,15px);letter-spacing:.32em;color:var(--muted);margin-bottom:20px}.number{font-variant-numeric:tabular-nums;font-size:clamp(78px,25vw,170px);line-height:.9;letter-spacing:.08em;font-weight:700}.title{font-size:clamp(28px,8vw,56px);letter-spacing:.12em;font-weight:700}.sub{font-size:clamp(12px,3.4vw,18px);letter-spacing:.22em;color:var(--muted);margin-top:18px}.gold{color:var(--gold);text-shadow:0 0 18px rgba(211,173,59,.12)}.rule{width:0;height:1px;background:var(--gold);margin:24px auto;opacity:.85;transition:width 1.2s ease}.show .rule{width:68px}#s4.show .number{animation:register 1.45s cubic-bezier(.2,.8,.2,1)}@keyframes register{0%{opacity:0;transform:scale(.94)}48%{transform:scale(1.025);text-shadow:0 0 28px rgba(211,173,59,.5)}100%{transform:scale(1)}}.scan{position:absolute;left:15%;right:15%;height:1px;top:34%;opacity:0;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 10px rgba(211,173,59,.35)}#s3.show .scan{animation:scan 2.7s ease-in-out .35s 1}@keyframes scan{0%{opacity:0;transform:translateY(-34px)}25%{opacity:.65}75%{opacity:.45}100%{opacity:0;transform:translateY(92px)}}#s1.show .symbols{animation:symbolIn 2.2s ease both}@keyframes symbolIn{0%{opacity:0;letter-spacing:.32em;filter:blur(7px)}55%{opacity:1;filter:blur(0)}100%{letter-spacing:.13em}}#s6.show .symbols{animation:softPulse 3.8s ease-in-out infinite}@keyframes softPulse{0%,100%{opacity:.72}50%{opacity:1}}#reset{position:fixed;right:8px;bottom:8px;border:0;background:transparent;color:#171717;font-size:12px;padding:12px}@media(prefers-reduced-motion:reduce){.scene,.rule{transition:none!important}*{animation:none!important}}
</style></head><body><main id="stage" aria-live="polite">
<section class="scene" id="s1"><div class="symbols">○ △ □</div></section>
<section class="scene" id="s2"><div class="eyebrow">INVITATION AUTHORISED</div><div class="title">VIP <span class="gold">007</span></div></section>
<section class="scene" id="s3"><div class="scan"></div><div class="eyebrow">PLAYERS REGISTERED</div><div class="number" id="countBefore">005</div></section>
<section class="scene" id="s4"><div class="eyebrow">REGISTRATION ACCEPTED</div><div class="number gold" id="countAfter">006</div></section>
<section class="scene" id="s5"><div class="eyebrow">REGISTRATION COMPLETE</div><div class="title">PLAYER <span class="gold" id="player">006</span></div><div class="rule"></div><div class="sub">INVITED BY VIP 007</div></section>
<section class="scene" id="s6"><div class="symbols" style="font-size:clamp(34px,10vw,70px)">○ △ □</div><div class="rule"></div><div class="title" style="font-size:clamp(22px,6vw,42px)">THE GAME WILL<br>BEGIN SHORTLY</div><div class="sub">PLAYER <span id="playerFinal">006</span></div></section>
</main><button id="reset" aria-label="Reset invitation">•</button>
<script>(()=>{const KEY="vip007_player",candidates=[2,3,4,5,6,8,9,10,11,12];let n=Number(localStorage.getItem(KEY));if(!candidates.includes(n)){n=candidates[Math.floor(Math.random()*candidates.length)];localStorage.setItem(KEY,String(n))}const fmt=x=>String(x).padStart(3,"0");countBefore.textContent=fmt(Math.max(1,n-1));countAfter.textContent=fmt(n);player.textContent=fmt(n);playerFinal.textContent=fmt(n);const scenes=["s1","s2","s3","s4","s5","s6"].map(id=>document.getElementById(id)),holds=[3000,3200,3900,3100,4300,999999],fade=1050,sleep=ms=>new Promise(r=>setTimeout(r,ms));async function play(){for(let i=0;i<scenes.length;i++){scenes.forEach(s=>s.classList.remove("show","leave"));scenes[i].classList.add("show");await sleep(holds[i]);if(i<scenes.length-1){scenes[i].classList.add("leave");await sleep(fade)}}}setTimeout(play,650);reset.addEventListener("click",()=>{localStorage.removeItem(KEY);location.reload()})})();</script></body></html>
